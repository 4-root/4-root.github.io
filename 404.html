<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // acesso não encontrado — 4root</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/png" href="static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --neon: #00ff41;
      --text: #ededed;
      --muted: #8a8a8a;
      --line: #1f1f1f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Ubuntu', sans-serif;
      padding: 24px;
    }

    .terminal {
      max-width: 560px;
      width: 100%;
      border: 1px solid var(--line);
      background: #070707;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.08);
    }

    .terminal-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #0a0a0a;
    }

    .terminal-bar span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--line);
    }

    .terminal-body {
      padding: 40px 32px;
      font-family: 'Ubuntu', monospace;
    }

    .code {
      color: var(--neon);
      font-size: 44px;
      font-weight: 700;
      font-family: 'Sora', sans-serif;
      letter-spacing: 2px;
      text-shadow: 0 0 18px rgba(0, 255, 65, 0.45);
    }

    .msg {
      margin-top: 14px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    .cmd {
      display: block;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }

    .cmd b {
      color: var(--neon);
      font-weight: 500;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
      border: 1px solid var(--neon);
      color: var(--neon);
      transition: background .2s, color .2s;
    }

    .btn:hover {
      background: var(--neon);
      color: var(--bg);
    }

    .btn-ghost {
      border-color: var(--line);
      color: var(--muted);
    }

    .btn-ghost:hover {
      background: transparent;
      border-color: var(--muted);
      color: var(--text);
    }
  </style>
</head>

<body>
  <main class="terminal">
    <div class="terminal-bar" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="terminal-body">
      <div class="code">404</div>
      <p class="msg">Acesso solicitado não existe neste servidor.<br>
        O caminho foi movido, renomeado ou nunca esteve aqui.</p>
      <span class="cmd"><b>root@4root</b>:~$ cd /home &amp;&amp; retomar navegação</span>
      <div class="actions">
        <a class="btn" href="/">voltar ao início</a>
        <a class="btn btn-ghost" href="https://discord.gg/Aw4F6qXS4N" rel="noopener noreferrer">entrar no Discord</a>
      </div>
    </div>
  </main>
</body>

</html>
