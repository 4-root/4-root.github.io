<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4root | Página não encontrada</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://4root.com.br/">
  <link rel="icon" type="image/png" href="https://4root.com.br/static/favicon.png">

  <!--
    404 com redirecionamento imediato para a home (padrão recomendado pelo Google).

    Como funciona:
    - O GitHub Pages continua devolvendo status HTTP 404 para URLs inexistentes
      (isso é BOM: o Google não indexa URLs quebradas e o Search Console
      relata tudo como 404 normal, sem soft-404).
    - O visitante humano é levado instantaneamente para https://4root.com.br/
      (meta refresh + location.replace, sem sujar o histórico do navegador).
    - Se ambos os mecanismos falharem, aparece o botão de fallback.
  -->
  <meta http-equiv="refresh" content="0;url=https://4root.com.br/">
  <script>location.replace("https://4root.com.br/");</script>

  <style>
    :root {
      --bg: #050505;
      --neon: #00ff41;
      --text: #ededed;
      --muted: #8a8a8a;
      --line: #1f1f1f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Ubuntu', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .code {
      color: var(--muted);
      letter-spacing: .4em;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .brand {
      font-size: clamp(48px, 10vw, 96px);
      font-weight: 700;
      letter-spacing: .06em;
      font-family: 'Courier New', monospace;
    }
    .hash { color: var(--muted); }
    .neon {
      color: var(--neon);
      text-shadow: 0 0 14px rgba(0, 255, 65, .55);
    }
    .root { color: var(--text); }
    .msg {
      margin-top: 18px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: .04em;
    }
    .cursor {
      display: inline-block;
      width: 9px;
      height: 1.05em;
      background: var(--neon);
      margin-left: 6px;
      vertical-align: text-bottom;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .fallback { margin-top: 36px; font-size: 13px; }
    .fallback a {
      color: var(--neon);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 10px 18px;
      letter-spacing: .08em;
    }
    .fallback a:hover { border-color: var(--neon); }
  </style>
</head>
<body>
  <main>
    <p class="code">[ 404 ]</p>
    <p class="brand" aria-label="4root"><span class="hash">#_</span><span class="neon">4</span><span class="root">root</span></p>
    <p class="msg">// página não encontrada — redirecionando para a home<span class="cursor"></span></p>
    <p class="fallback"><a href="https://4root.com.br/">ir para 4root.com.br</a></p>
  </main>
</body>
</html>
